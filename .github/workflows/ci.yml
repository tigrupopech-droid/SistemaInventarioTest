name: CI - Build y Pruebas Automatizadas

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  build:
    name: Build y pruebas
    runs-on: ubuntu-latest

    steps:

      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Mostrar versiones
        run: |
          java -version
          mvn -version

      - name: Compilar proyecto
        run: mvn clean compile

      - name: Ejecutar pruebas unitarias
        run: mvn test

      - name: Ejecutar pruebas de integracion
        run: mvn verify